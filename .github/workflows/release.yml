name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run all
      - name: Ensure dist committed expectation
        run: |
          test -f dist/index.js
          echo "Build OK. Create and push tag ${{ inputs.tag }} manually after review."
          echo "This workflow intentionally does not publish to Marketplace."
